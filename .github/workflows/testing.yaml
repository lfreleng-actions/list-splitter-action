---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Runs the unit tests, then exercises the action from this repository
# through '$/': each output format, validation failure, and a matrix
# built from the json output, which is how most callers consume it.
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@93962991c9e4cc04d77d81e619475c868a226277'  # v0.17.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own python3, as action.yaml uses: the suite needs
      # nothing beyond the standard library.
      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          python3 -B -m unittest discover -s tests -v

  action-tests:
    name: "Action tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      json: ${{ steps.repositories.outputs.json }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@93962991c9e4cc04d77d81e619475c868a226277'  # v0.17.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Split a repository list"
        id: repositories
        uses: $/
        with:
          list: |
            repo-b, Repo-A repo-a
            repo-b
          validate: "repository"

      - name: "Check the repository list outputs"
        shell: bash
        env:
          JSON: ${{ steps.repositories.outputs.json }}
          CSV: ${{ steps.repositories.outputs.csv }}
          LINES: ${{ steps.repositories.outputs.lines }}
          COUNT: ${{ steps.repositories.outputs.count }}
          FIRST: ${{ fromJSON(steps.repositories.outputs.json)[0] }}
        run: |
          # Check the repository list outputs
          set -euo pipefail
          [ "$JSON" = '["repo-b","Repo-A"]' ]
          [ "$CSV" = 'repo-b,Repo-A' ]
          [ "$LINES" = $'repo-b\nRepo-A' ]
          [ "$COUNT" = '2' ]
          [ "$FIRST" = 'repo-b' ]

      - name: "Split a glob list without validation"
        id: globs
        uses: $/
        with:
          list: "*-workflows, *-Workflows"

      - name: "Check the glob list outputs"
        shell: bash
        env:
          JSON: ${{ steps.globs.outputs.json }}
          COUNT: ${{ steps.globs.outputs.count }}
        run: |
          # Check the glob list outputs
          set -euo pipefail
          [ "$JSON" = '["*-workflows","*-Workflows"]' ]
          [ "$COUNT" = '2' ]

      - name: "Split a blank list"
        id: blank
        uses: $/
        with:
          list: " , "
          validate: "repository"

      - name: "Check the blank list outputs"
        shell: bash
        env:
          JSON: ${{ steps.blank.outputs.json }}
          CSV: ${{ steps.blank.outputs.csv }}
          COUNT: ${{ steps.blank.outputs.count }}
        run: |
          # Check the blank list outputs
          set -euo pipefail
          [ "$JSON" = '[]' ]
          [ "$CSV" = '' ]
          [ "$COUNT" = '0' ]

      - name: "Split an invalid repository list [expected failure]"
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          list: "lfreleng-actions/repo, bad!"
          validate: "repository"

      - name: "Error if the invalid list did NOT fail"
        if: steps.invalid.outcome != 'failure'
        shell: bash
        run: |
          # Error if the invalid list did NOT fail
          echo "Error: an invalid repository list was accepted ❌"
          exit 1

  matrix:
    name: "Matrix (${{ matrix.repository }})"
    needs: action-tests
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    strategy:
      matrix:
        repository: ${{ fromJSON(needs.action-tests.outputs.json) }}
    steps:
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'

      - name: "Check the matrix entry"
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          # Check the matrix entry
          set -euo pipefail
          case "$REPOSITORY" in
            repo-b|Repo-A) echo "Matrix entry: $REPOSITORY ✅" ;;
            *) echo "Error: unexpected matrix entry $REPOSITORY ❌"; exit 1 ;;
          esac
