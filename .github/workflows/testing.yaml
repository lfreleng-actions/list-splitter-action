---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Runs the unit tests, then exercises the action from this repository
# through '$/': each output format, validation failure, and a matrix
# built from the json output, which is how most callers consume it.
# The verification job looks up public objects that will not go away,
# with the job's own token, so it needs api.github.com and nothing more.
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: '@93962991c9e4cc04d77d81e619475c868a226277'  # v0.17.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own python3, as action.yaml uses: the suite needs
      # nothing beyond the standard library.
      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          python3 -B -m unittest discover -s tests -v

  action-tests:
    name: "Action tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      json: ${{ steps.repositories.outputs.json }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: '@93962991c9e4cc04d77d81e619475c868a226277'  # v0.17.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Split a repository list"
        id: repositories
        uses: $/
        with:
          list: |
            repo-b, Repo-A repo-a
            repo-b
          validate: "repository"

      - name: "Check the repository list outputs"
        shell: bash
        env:
          JSON: ${{ steps.repositories.outputs.json }}
          CSV: ${{ steps.repositories.outputs.csv }}
          LINES: ${{ steps.repositories.outputs.lines }}
          COUNT: ${{ steps.repositories.outputs.count }}
          FIRST: ${{ fromJSON(steps.repositories.outputs.json)[0] }}
          REPOSITORIES: ${{ steps.repositories.outputs.repositories }}
          # yamllint disable-line rule:line-length
          OWNER: ${{ fromJSON(steps.repositories.outputs.details)[1].owner }}
        run: |
          # Check the repository list outputs
          set -euo pipefail
          [ "$JSON" = '["repo-b","Repo-A"]' ]
          [ "$CSV" = 'repo-b,Repo-A' ]
          [ "$LINES" = $'repo-b\nRepo-A' ]
          [ "$COUNT" = '2' ]
          [ "$FIRST" = 'repo-b' ]
          [ "$REPOSITORIES" = 'repo-b,Repo-A' ]
          [ "$OWNER" = "$GITHUB_REPOSITORY_OWNER" ]

      - name: "Split a pull request list"
        id: pulls
        uses: $/
        with:
          list: |
            repo-a#12, octo-org/repo-a/pull/12
            https://github.com/octo-org/repo-b/pull/3/
          validate: "pull-request"
          owner: "octo-org"

      - name: "Check the pull request list outputs"
        shell: bash
        env:
          JSON: ${{ steps.pulls.outputs.json }}
          REPOSITORIES: ${{ steps.pulls.outputs.repositories }}
          NUMBER: ${{ fromJSON(steps.pulls.outputs.details)[1].number }}
        run: |
          # Check the pull request list outputs
          set -euo pipefail
          [ "$JSON" = '["octo-org/repo-a#12","octo-org/repo-b#3"]' ]
          [ "$REPOSITORIES" = 'repo-a,repo-b' ]
          [ "$NUMBER" = '3' ]

      - name: "Split an organisation list"
        id: organisations
        uses: $/
        with:
          list: "lfreleng-actions LFRELENG-ACTIONS, octo-org"
          validate: "organisation"

      - name: "Check the organisation list outputs"
        shell: bash
        env:
          JSON: ${{ steps.organisations.outputs.json }}
          REPOSITORIES: ${{ steps.organisations.outputs.repositories }}
          DETAILS: ${{ steps.organisations.outputs.details }}
        run: |
          # Check the organisation list outputs
          set -euo pipefail
          [ "$JSON" = '["lfreleng-actions","octo-org"]' ]
          [ "$REPOSITORIES" = '' ]
          expected='[{"item":"lfreleng-actions","login":"lfreleng-actions"},'
          expected+='{"item":"octo-org","login":"octo-org"}]'
          [ "$DETAILS" = "$expected" ]

      - name: "Split a glob list without validation"
        id: globs
        uses: $/
        with:
          list: "*-workflows, *-Workflows"

      - name: "Check the glob list outputs"
        shell: bash
        env:
          JSON: ${{ steps.globs.outputs.json }}
          COUNT: ${{ steps.globs.outputs.count }}
        run: |
          # Check the glob list outputs
          set -euo pipefail
          [ "$JSON" = '["*-workflows","*-Workflows"]' ]
          [ "$COUNT" = '2' ]

      - name: "Split a blank list"
        id: blank
        uses: $/
        with:
          list: " , "
          validate: "repository"

      - name: "Check the blank list outputs"
        shell: bash
        env:
          JSON: ${{ steps.blank.outputs.json }}
          CSV: ${{ steps.blank.outputs.csv }}
          COUNT: ${{ steps.blank.outputs.count }}
        run: |
          # Check the blank list outputs
          set -euo pipefail
          [ "$JSON" = '[]' ]
          [ "$CSV" = '' ]
          [ "$COUNT" = '0' ]

      - name: "Split an invalid repository list [expected failure]"
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          list: "lfreleng-actions/repo, bad!"
          validate: "repository"

      - name: "Error if the invalid list did NOT fail"
        if: steps.invalid.outcome != 'failure'
        shell: bash
        run: |
          # Error if the invalid list did NOT fail
          echo "Error: an invalid repository list was accepted ❌"
          exit 1

      - name: "Split an issue list naming another owner [expected failure]"
        id: foreign
        continue-on-error: true
        uses: $/
        with:
          list: "repo#1 other-org/repo#2"
          validate: "issue"
          owner: "octo-org"

      - name: "Error if the foreign issue list did NOT fail"
        if: steps.foreign.outcome != 'failure'
        shell: bash
        run: |
          # Error if the foreign issue list did NOT fail
          echo "Error: an issue in another owner was accepted ❌"
          exit 1

  verify-tests:
    name: "Verification tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: '@93962991c9e4cc04d77d81e619475c868a226277'  # v0.17.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Verify a repository list"
        id: repositories
        uses: $/
        with:
          list: "list-splitter-action, .github"
          validate: "repository"
          owner: "lfreleng-actions"
          verify: "true"

      - name: "Verify a pull request list"
        id: pulls
        uses: $/
        with:
          # yamllint disable-line rule:line-length
          list: "https://github.com/lfreleng-actions/list-splitter-action/pull/3"
          validate: "pull-request"
          owner: "lfreleng-actions"
          verify: "true"

      - name: "Verify an issue list"
        id: issues
        uses: $/
        with:
          list: ".github#179"
          validate: "issue"
          owner: "lfreleng-actions"
          verify: "true"

      - name: "Verify an organisation list"
        id: organisations
        uses: $/
        with:
          list: "lfreleng-actions"
          validate: "organisation"
          verify: "true"

      - name: "Verify a user list"
        id: users
        uses: $/
        with:
          list: "octocat"
          validate: "user"
          verify: "true"

      - name: "Check what verification found"
        shell: bash
        env:
          # yamllint disable rule:line-length
          REPOSITORY: ${{ fromJSON(steps.repositories.outputs.details)[0].html_url }}
          BRANCH: ${{ fromJSON(steps.repositories.outputs.details)[1].default_branch }}
          PULL_STATE: ${{ fromJSON(steps.pulls.outputs.details)[0].state }}
          ISSUE: ${{ fromJSON(steps.issues.outputs.details)[0].html_url }}
          ORGANISATION: ${{ fromJSON(steps.organisations.outputs.details)[0].html_url }}
          USER: ${{ fromJSON(steps.users.outputs.details)[0].html_url }}
          # yamllint enable rule:line-length
        run: |
          # Check what verification found
          set -euo pipefail
          base='https://github.com'
          [ "$REPOSITORY" = "$base/lfreleng-actions/list-splitter-action" ]
          [ "$BRANCH" = 'main' ]
          [ "$PULL_STATE" = 'merged' ]
          [ "$ISSUE" = "$base/lfreleng-actions/.github/issues/179" ]
          [ "$ORGANISATION" = "$base/lfreleng-actions" ]
          [ "$USER" = "$base/octocat" ]

      - name: "Verify a pull request as an issue [expected failure]"
        id: wrong-kind
        continue-on-error: true
        uses: $/
        with:
          list: "list-splitter-action#3"
          validate: "issue"
          owner: "lfreleng-actions"
          verify: "true"

      - name: "Verify a user as an organisation [expected failure]"
        id: wrong-type
        continue-on-error: true
        uses: $/
        with:
          list: "octocat"
          validate: "organisation"
          verify: "true"

      - name: "Error if a mismatched item did NOT fail"
        if: >-
          steps.wrong-kind.outcome != 'failure'
          || steps.wrong-type.outcome != 'failure'
        shell: bash
        run: |
          # Error if a mismatched item did NOT fail
          echo "Error: verification accepted a mismatched item ❌"
          exit 1

  matrix:
    name: "Matrix (${{ matrix.repository }})"
    needs: action-tests
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    strategy:
      matrix:
        repository: ${{ fromJSON(needs.action-tests.outputs.json) }}
    steps:
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'

      - name: "Check the matrix entry"
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          # Check the matrix entry
          set -euo pipefail
          case "$REPOSITORY" in
            repo-b|Repo-A) echo "Matrix entry: $REPOSITORY ✅" ;;
            *) echo "Error: unexpected matrix entry $REPOSITORY ❌"; exit 1 ;;
          esac
