# Tool configuration only; this repository is not a Python package.

[tool.basedpyright]
# action.yaml runs the script on its own Python 3.12, which it sets up
# with actions/setup-python rather than taking the runner's python3.
# Checking against 3.11, the organisation's minimum, keeps the code
# free of features newer than any interpreter it supports.
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["scripts", "tests"]
# The tests import the script as a top-level module, as python3 does
# when it puts the script's directory on sys.path.
extraPaths = ["scripts"]
