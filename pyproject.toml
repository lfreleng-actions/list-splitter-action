# Tool configuration only; this repository is not a Python package.

[tool.basedpyright]
# action.yaml runs the script on Python 3.12 from actions/setup-python.
# 3.10 stays the floor so the suite still runs on the distro python3
# of ubuntu-22.04, the oldest GitHub-hosted Ubuntu image.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["scripts", "tests"]
# The tests import the script as a top-level module, as python3 does
# when it puts the script's directory on sys.path.
extraPaths = ["scripts"]
