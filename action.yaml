---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Splits a comma, space or newline separated list (typically a
# workflow_dispatch input) into items, removes repeats, optionally
# validates each item, and publishes the result as JSON, CSV, one
# item per line, and a count. Needs python3 on the runner; it makes no
# network calls and takes no token.
name: "✂️ List Splitter"
# yamllint disable-line rule:line-length
description: "Splits comma, space or newline separated lists into validated JSON and CSV"

inputs:
  list:
    description: "Items separated by commas, spaces, tabs or newlines"
    required: false
    default: ""
  validate:
    description: "Item check: none, or repository for bare repository names"
    required: false
    default: "none"
  ignore-case:
    description: "Treat items differing in case as repeats: auto, true, false"
    required: false
    default: "auto"

outputs:
  json:
    description: "JSON array of the items, in the order given"
    value: ${{ steps.split.outputs.json }}
  csv:
    description: "Items joined by commas"
    value: ${{ steps.split.outputs.csv }}
  lines:
    description: "Items one per line"
    value: ${{ steps.split.outputs.lines }}
  count:
    description: "Number of items"
    value: ${{ steps.split.outputs.count }}

runs:
  using: "composite"
  steps:
    - name: "Split list"
      id: split
      shell: bash
      env:
        SPLIT_LIST: ${{ inputs.list }}
        SPLIT_VALIDATE: ${{ inputs.validate }}
        SPLIT_IGNORE_CASE: ${{ inputs.ignore-case }}
      run: |
        # Split list
        python3 -B "${GITHUB_ACTION_PATH}/scripts/split_list.py"
