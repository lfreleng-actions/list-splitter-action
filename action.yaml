---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Splits a comma, space or newline separated list (typically a
# workflow_dispatch input) into items, removes repeats, optionally
# validates each item as a repository, issue, pull request,
# organisation or user, and publishes the result as JSON, CSV, one
# item per line, and a count. Needs python3 on the runner. It makes no
# network calls unless verify is true, when it confirms every item
# on GitHub in batched GraphQL queries using the token input.
name: "✂️ List Splitter"
# yamllint disable-line rule:line-length
description: "Splits comma, space or newline separated lists into validated JSON and CSV"

inputs:
  list:
    description: "Items separated by commas, spaces, tabs or newlines"
    required: false
    default: ""
  validate:
    # yamllint disable-line rule:line-length
    description: "Item check: none, repository, issue, pull-request, organisation or user"
    required: false
    default: "none"
  ignore-case:
    description: "Treat items differing in case as repeats: auto, true, false"
    required: false
    default: "auto"
  owner:
    # yamllint disable-line rule:line-length
    description: "Owner that repositories, issues and pull requests belong to; blank uses the workflow's owner"
    required: false
    default: ""
  verify:
    # yamllint disable-line rule:line-length
    description: "Confirm each item exists on GitHub as its mode describes: true or false"
    required: false
    default: "false"
  token:
    description: "Token for verify; it needs read access to the items"
    required: false
    default: ${{ github.token }}

outputs:
  json:
    description: "JSON array of the items, in the order given"
    value: ${{ steps.split.outputs.json }}
  csv:
    description: "Items joined by commas"
    value: ${{ steps.split.outputs.csv }}
  lines:
    description: "Items one per line"
    value: ${{ steps.split.outputs.lines }}
  count:
    description: "Number of items"
    value: ${{ steps.split.outputs.count }}
  repositories:
    description: "Distinct repositories the items name, joined by commas"
    value: ${{ steps.split.outputs.repositories }}
  details:
    description: "JSON array describing each item, in the order of json"
    value: ${{ steps.split.outputs.details }}

runs:
  using: "composite"
  steps:
    - name: "Split list"
      id: split
      shell: bash
      env:
        SPLIT_LIST: ${{ inputs.list }}
        SPLIT_VALIDATE: ${{ inputs.validate }}
        SPLIT_IGNORE_CASE: ${{ inputs.ignore-case }}
        SPLIT_OWNER: ${{ inputs.owner }}
        SPLIT_VERIFY: ${{ inputs.verify }}
        SPLIT_TOKEN: ${{ inputs.token }}
      run: |
        # Split list
        python3 -B "${GITHUB_ACTION_PATH}/scripts/split_list.py"
